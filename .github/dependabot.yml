# Routine dependency updates: monthly, grouped per ecosystem so each sweep
# lands as one version-update PR per ecosystem, gated by the normal checks.
#
# Version updates skip majors: those are a conscious adoption at the
# project's dependency review, not a monthly bot PR. Security updates have
# their own group so a fix is never held back behind routine bumps.
version: 2
updates:
  # Package.swift is generated by the mapmap monorepo's release-ios.yml, so a
  # requirement change must also be made at source there; a bot PR here is the
  # signal to do that. valhalla-mobile is pinned up to the next minor.
  - package-ecosystem: swift
    directory: "/"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    labels: [dependencies]
    commit-message:
      prefix: "chore(deps)"
    groups:
      swift-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      swift-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # Majors are a conscious adoption at the project's dependency
      # review, not a monthly bot PR.
      - dependency-name: "*"
        update-types: [version-update:semver-major]
